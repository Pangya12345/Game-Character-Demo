services:
  - type: web
    name: haggle-market
    runtime: node
    rootDir: Huggle Market # all the code lives in this folder
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FLOOR_PRICE
        value: "80"
