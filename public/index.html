<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Haggle Market</title>
  <meta name="description" content="เกมต่อราคามะม่วงกับแม่ค้าสมศรี (AI) — พิมพ์คุยได้ทั้งไทยและอังกฤษ">
  <meta property="og:title" content="ตลาดต่อราคา · Haggle Market">
  <meta property="og:description" content="ต่อราคามะม่วงกับแม่ค้าสมศรี AI ปากร้ายใจดี ใครต่อได้ถูกสุดชนะ!">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'><rect x='2' y='0' width='1' height='2' fill='%234a7a2a'/><rect x='3' y='1' width='2' height='1' fill='%237cb342'/><rect x='1' y='2' width='5' height='5' fill='%23f4c430'/><rect x='2' y='7' width='3' height='1' fill='%23e08a2a'/><rect x='6' y='3' width='1' height='3' fill='%23e08a2a'/><rect x='2' y='3' width='1' height='1' fill='%23fff2a8'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <main class="console">
    <div class="joycon left" aria-label="Left controller">
      <button class="jc-btn tiny" id="btnMute" title="เปิด/ปิดเสียง · Sound on/off" aria-label="Toggle sound">−</button>
      <div class="stick" aria-hidden="true"></div>
      <div class="dpad" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="capture" aria-hidden="true"></div>
    </div>

    <div class="bezel">
      <div class="screen" id="screen">
        <div class="stage">
          <canvas id="scene" aria-label="Pixel-art market with Mae Kha Som Sri and the player"></canvas>
          <div class="hud">
            <div class="hud-box"><span id="lblMood">อารมณ์แม่ค้า:</span> <b id="moodVal" data-mood="neutral">เฉยๆ</b></div>
            <div class="hud-mid">
              <div id="turnVal">รอบ 0/12</div>
              <div class="timer" title="Idle timer"><div id="timerBar"></div></div>
            </div>
            <div class="hud-right">
              <div class="hud-box price"><span id="lblPrice">ราคาปัจจุบัน:</span> <b id="priceVal">120฿</b>
                <span class="price-pop" id="pricePop"></span>
              </div>
              <div class="hud-wallet" id="walletVal" data-state="ok"></div>
            </div>
          </div>
        </div>

        <div class="bubble npc" id="npcBubble">
          <div class="nametag">Mae Kha Som Sri</div>
          <p id="npcText" aria-live="polite"></p>
        </div>
        <div class="bubble player hidden" id="playerBubble">
          <p id="playerText"></p>
          <i class="more" aria-hidden="true">▼</i>
        </div>

        <form class="chatbar" id="chatForm" autocomplete="off">
          <label for="chatInput" id="lblChat">พิมพ์แชท:</label>
          <input id="chatInput" maxlength="280" enterkeyhint="send" disabled>
          <button type="submit" id="sendBtn" disabled>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 7.5 15 1 11 15 8 9.5zM8 9.5 15 1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <span>SEND</span>
          </button>
        </form>

        <div class="toast" id="toast" role="status"></div>
        <aside class="log hidden" id="logPanel"></aside>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>

    <div class="joycon right" aria-label="Right controller">
      <button class="jc-btn tiny" id="btnRestart" title="เริ่มใหม่ · Restart" aria-label="Restart">+</button>
      <div class="abxy">
        <button class="jc-btn x" id="btnLog" title="X: บันทึกการคุย · Chat log">X</button>
        <button class="jc-btn y" id="btnHint" title="Y: คำใบ้ · Hint">Y</button>
        <button class="jc-btn a" id="btnA" title="A: ส่งข้อความ · Send">A</button>
        <button class="jc-btn b" id="btnB" title="B: ล้างข้อความ · Clear">B</button>
      </div>
      <div class="stick" aria-hidden="true"></div>
      <button class="jc-btn home" id="btnHome" title="หน้าแรก · Title screen" aria-label="Title screen"></button>
    </div>
  </main>

  <nav class="mobile-controls" aria-label="Game controls">
    <button data-act="hint">HINT</button>
    <button data-act="restart">RESTART</button>
  </nav>

  <p class="footnote" id="modeNote"></p>

  <script type="module" src="js/game.js"></script>
</body>
</html>
